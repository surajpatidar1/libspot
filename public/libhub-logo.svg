<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background rounded gradient -->
    <linearGradient id="lh-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1F4959" />
      <stop offset="100%" stop-color="#0c2029" />
    </linearGradient>

    <!-- Vibrant teal accent gradient -->
    <linearGradient id="lh-teal" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Top plate highlight -->
    <linearGradient id="lh-top" x1="20" y1="12" x2="44" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>

    <!-- Inner ambient glow -->
    <filter id="lh-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#14b8a6" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Hex / Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#lh-bg)" stroke="#14b8a6" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Isometric Library Nodes (Representing modular packages connected to a central hub) -->
  <g filter="url(#lh-glow)">
    <!-- Top Package Plane (Isometric Rhombus) -->
    <path d="M32 12L48 21.2L32 30.4L16 21.2L32 12Z" fill="url(#lh-top)" />
    
    <!-- Left Package Pillar (Isometric 'L') -->
    <path d="M16 24.5L30 32.5V47.5L16 39.5V24.5Z" fill="#1F4959" stroke="#2dd4bf" stroke-width="0.8" stroke-opacity="0.6" />
    
    <!-- Right Package Pillar (Isometric 'H') -->
    <path d="M34 32.5L48 24.5V39.5L34 47.5V32.5Z" fill="#133542" stroke="#2dd4bf" stroke-width="0.8" stroke-opacity="0.6" />

    <!-- Central Radiant Hub Node (The "Hub" Core) -->
    <circle cx="32" cy="30.4" r="3.5" fill="#ffffff" />
    <circle cx="32" cy="30.4" r="2" fill="#14b8a6" />

    <!-- Interconnecting Code Struts -->
    <path d="M32 18V27M22 24.5L28.5 28.5M42 24.5L35.5 28.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
    <path d="M32 34V42" stroke="#2dd4bf" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Bottom Accent Light Dots -->
  <circle cx="23" cy="43.5" r="1.5" fill="#2dd4bf" />
  <circle cx="41" cy="43.5" r="1.5" fill="#2dd4bf" />
</svg>
